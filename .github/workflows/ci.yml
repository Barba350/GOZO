name: Build and security tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: node --check wwwroot/app.js && node --check wwwroot/interactions.js
      - run: node tests/ticket-ui.test.cjs
      - run: python tests/aceptacion.py
      - run: python tests/dependency-audit.py
      - name: Database and secret exclusions
        run: python tests/repository-safety.py
